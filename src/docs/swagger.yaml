
paths:
  /v1/user:
    post:
      tags: [Usuários]
      summary: Cadastrar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstname, surname, email, password]
              properties:
                firstname:
                  type: string
                  example: Maria
                surname:
                  type: string
                  example: Silva
                email:
                  type: string
                  format: email
                  example: maria@example.com
                password:
                  type: string
                  format: password
                  example: SenhaTeste123!
      responses:
        '201':
          description: Usuário cadastrado
        '400':
          description: Dados inválidos

  /v1/user/token:
    post:
      tags: [Usuários]
      summary: Autenticar usuário e gerar JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: maria@example.com
                password:
                  type: string
                  format: password
                  example: SenhaTeste123!
      responses:
        '200':
          description: Token JWT gerado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Credenciais inválidas

  /v1/user/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags: [Usuários]
      summary: Consultar usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário encontrado
        '401':
          description: Não autenticado
        '404':
          description: Usuário não encontrado
    put:
      tags: [Usuários]
      summary: Atualizar usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstname:
                  type: string
                surname:
                  type: string
                email:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Usuário atualizado
        '403':
          description: Acesso negado
    delete:
      tags: [Usuários]
      summary: Excluir usuário
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Usuário excluído
        '403':
          description: Acesso negado

  /v1/category/search:
    get:
      tags: [Categorias]
      summary: Listar categorias
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista paginada de categorias

  /v1/category/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags: [Categorias]
      summary: Consultar categoria
      responses:
        '200':
          description: Categoria encontrada
        '404':
          description: Categoria não encontrada
    put:
      tags: [Categorias]
      summary: Atualizar categoria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '200':
          description: Categoria atualizada
    delete:
      tags: [Categorias]
      summary: Excluir categoria
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Categoria excluída

  /v1/category:
    post:
      tags: [Categorias]
      summary: Cadastrar categoria
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInput'
      responses:
        '201':
          description: Categoria cadastrada

  /v1/product/search:
    get:
      tags: [Produtos]
      summary: Listar produtos
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: enabled
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Lista paginada de produtos

  /v1/product/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      tags: [Produtos]
      summary: Consultar produto com relacionamentos
      responses:
        '200':
          description: Produto encontrado
        '404':
          description: Produto não encontrado
    put:
      tags: [Produtos]
      summary: Atualizar produto e relacionamentos
      description: >
        Ao informar images ou options, a coleção correspondente
        é substituída integralmente. Campos omitidos são preservados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Produto atualizado
        '400':
          description: Dados inválidos
    delete:
      tags: [Produtos]
      summary: Excluir produto
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Produto excluído

  /v1/product:
    post:
      tags: [Produtos]
      summary: Cadastrar produto com relacionamentos
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Produto cadastrado
        '400':
          description: Dados inválidos

components:
  schemas:
    CategoryInput:
      type: object
      properties:
        name:
          type: string
          example: Calçados Esportivos
        slug:
          type: string
          example: calcados-esportivos
        use_in_menu:
          type: boolean
          example: true

    ProductInput:
      type: object
      properties:
        enabled:
          type: boolean
          example: true
        name:
          type: string
          example: Tênis Esportivo Premium
        slug:
          type: string
          example: tenis-esportivo-premium
        stock:
          type: integer
          example: 30
        description:
          type: string
          example: Tênis confortável para atividades físicas
        price:
          type: number
          example: 349.90
        price_with_discount:
          type: number
          example: 279.90
        category_ids:
          type: array
          items:
            type: integer
          example: [1]
        images:
          type: array
          items:
            type: object
            properties:
              enabled:
                type: boolean
              path:
                type: string
          example:
            - enabled: true
              path: https://exemplo.com/tenis.jpg
        options:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              shape:
                type: string
                enum: [square, circle]
              radius:
                type: integer
              type:
                type: string
                enum: [text, color]
              values:
                type: array
                items:
                  type: string
          example:
            - title: Tamanho
              shape: square
              radius: 0
              type: text
              values: ["38", "39", "40", "41"]
